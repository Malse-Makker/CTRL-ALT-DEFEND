server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers, inherited by every location below (see purrfolio for
    # the add_header-inside-location caveat).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~* \.(zip|png|ico)$ {
        expires 30d;
    }

    location ~* \.html$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
